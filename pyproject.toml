[project]
name = "cdc_v2"
version = "0.0.0"
description = "Postgres to MotherDuck change data capture on stock Debezium, run as a MotherDuck Flight"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdc_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
