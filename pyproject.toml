[project]
name = "cdc_v2"
version = "0.0.0"
description = "Postgres to MotherDuck change data capture on stock Debezium, run as a MotherDuck Flight"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.6",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest-timeout>=2.3",
    "pytest>=8",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdc_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not flight_integration'"
markers = [
    "flight_integration: creates, runs and deletes a real MotherDuck Flight (opt-in: -m flight_integration)",
]
pythonpath = ["src"]
